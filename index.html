<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jake's Top Lists</title>
<meta name="description" content="A personal top-50 ranking of games, albums and game soundtracks.">
<style>
:root{
  --bg:#EDF6FC; --bg2:#E3F3F6;
  --surface:rgba(255,255,255,.62); --surface-2:#DCEFF8;
  --ink:#0B2239; --muted:#4D7290;
  --accent:#17A7E0; --accent-2:#3FC481;
  --gold:#E59A12; --line:rgba(11,34,57,.14);
  --glow-op:.30;
  --display:'Outfit',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070D18; --bg2:#0C1930;
    --surface:rgba(16,26,46,.58); --surface-2:#162336;
    --ink:#EAF4FF; --muted:#80A0C2;
    --accent:#36CFFF; --accent-2:#5FF0A8;
    --gold:#FFC65C; --line:rgba(255,255,255,.12);
    --glow-op:.5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070D18; --bg2:#0C1930;
  --surface:rgba(16,26,46,.58); --surface-2:#162336;
  --ink:#EAF4FF; --muted:#80A0C2;
  --accent:#36CFFF; --accent-2:#5FF0A8;
  --gold:#FFC65C; --line:rgba(255,255,255,.12);
  --glow-op:.5;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(175deg,var(--bg),var(--bg2));color:var(--ink);font-family:var(--body);padding-inline:16px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0}

.bg-aurora{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg-aurora span{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--glow-op)}
.bg-aurora .b1{width:52vmax;height:52vmax;top:-22vmax;left:-18vmax;background:radial-gradient(circle,var(--accent),transparent 70%)}
.bg-aurora .b2{width:56vmax;height:56vmax;bottom:-26vmax;right:-20vmax;background:radial-gradient(circle,var(--accent-2),transparent 70%)}

.wrap{max-width:1180px;margin:0 auto;position:relative;z-index:1}

.glass{background:var(--surface);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.22)}
.sheen{position:relative;overflow:hidden}
.sheen::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,.18) 22%,rgba(255,255,255,0) 40%);mix-blend-mode:overlay}

header.top{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;
  margin-top:calc(env(safe-area-inset-top,0px) + 12px);
  border-radius:20px;padding:16px 18px 10px;
  box-shadow:0 10px 30px -14px rgba(10,30,60,.35), inset 0 1px 0 rgba(255,255,255,.4);
}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px}
.brand h1{font-size:clamp(22px,4.2vw,34px);font-weight:800;line-height:1.05;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
.counts{display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.counts b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;width:fit-content;background:rgba(0,0,0,.05)}
:root[data-theme="dark"] .tabs{background:rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){ .tabs{background:rgba(0,0,0,.28)} }
.tab{position:relative;overflow:hidden;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);background:none;border:none;padding:9px 16px;cursor:pointer;border-radius:999px}
.tab.active{color:#05111C;background:linear-gradient(180deg,var(--accent),var(--accent-2));box-shadow:0 4px 14px -4px rgba(23,167,224,.5), inset 0 1px 0 rgba(255,255,255,.55)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section{padding-block:26px 8px}
.sectitle{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sectitle h2{font-size:clamp(18px,2.6vw,24px);font-weight:700}
.sectitle span{color:var(--muted);font-family:var(--mono);font-size:11.5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.grid.reserve{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.grid.square{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}

.card{min-width:0;display:flex;flex-direction:column;gap:8px;position:relative}
.cover-wrap{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);transition:transform .18s ease,box-shadow .18s ease}
.cover-wrap.portrait{aspect-ratio:3/4.2}
.cover-wrap.square{aspect-ratio:1/1}
.card:hover .cover-wrap{transform:translateY(-3px);box-shadow:0 16px 28px -14px rgba(10,30,60,.4), 0 0 0 1px var(--accent) inset}
.cover-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px;color:var(--muted)}
.cover-empty svg{opacity:.55}
.cover-empty span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;line-height:1.4}

.rank{position:absolute;top:8px;left:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(6,20,36,.55);color:#fff;font-family:var(--mono);font-weight:600;font-size:12px;padding:3px 8px;border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.rating{position:absolute;bottom:8px;right:8px;background:var(--gold);color:#241705;font-family:var(--mono);font-weight:700;font-size:11px;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.reserve-tag{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:3px 7px;border-radius:999px}
.card.is-reserve .cover-wrap{filter:grayscale(.45) opacity(.82)}
.card.is-reserve:hover .cover-wrap{filter:none}
.card h3{font-size:14px;font-weight:700;line-height:1.25;margin:0}
.card .sub{color:var(--muted);font-size:11.5px}

.empty-state{border:1.5px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state b{color:var(--ink);display:block;margin-bottom:6px;font-family:var(--display);font-size:19px;font-weight:700}

footer{padding:40px 0 30px;color:var(--muted);font-family:var(--mono);font-size:11px;text-align:center}
footer a{color:var(--accent)}

@media (prefers-reduced-motion:reduce){ .cover-wrap,.tab{transition:none!important} }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
</head>
