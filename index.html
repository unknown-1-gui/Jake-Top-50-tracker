<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jake's Top Lists</title>
<meta name="description" content="A personal top-50 ranking of games, albums and game soundtracks.">
<style>
:root{
  --bg:#EDF6FC; --bg2:#E3F3F6;
  --surface:rgba(255,255,255,.62); --surface-2:#DCEFF8;
  --ink:#0B2239; --muted:#4D7290;
  --accent:#17A7E0; --accent-2:#3FC481;
  --gold:#E59A12; --line:rgba(11,34,57,.14);
  --glow-op:.30;
  --display:'Outfit',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070D18; --bg2:#0C1930;
    --surface:rgba(16,26,46,.58); --surface-2:#162336;
    --ink:#EAF4FF; --muted:#80A0C2;
    --accent:#36CFFF; --accent-2:#5FF0A8;
    --gold:#FFC65C; --line:rgba(255,255,255,.12);
    --glow-op:.5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070D18; --bg2:#0C1930;
  --surface:rgba(16,26,46,.58); --surface-2:#162336;
  --ink:#EAF4FF; --muted:#80A0C2;
  --accent:#36CFFF; --accent-2:#5FF0A8;
  --gold:#FFC65C; --line:rgba(255,255,255,.12);
  --glow-op:.5;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(175deg,var(--bg),var(--bg2));color:var(--ink);font-family:var(--body);padding-inline:16px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0}

.bg-aurora{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg-aurora span{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--glow-op)}
.bg-aurora .b1{width:52vmax;height:52vmax;top:-22vmax;left:-18vmax;background:radial-gradient(circle,var(--accent),transparent 70%)}
.bg-aurora .b2{width:56vmax;height:56vmax;bottom:-26vmax;right:-20vmax;background:radial-gradient(circle,var(--accent-2),transparent 70%)}

.wrap{max-width:1180px;margin:0 auto;position:relative;z-index:1}

.glass{background:var(--surface);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.22)}
.sheen{position:relative;overflow:hidden}
.sheen::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,.18) 22%,rgba(255,255,255,0) 40%);mix-blend-mode:overlay}

header.top{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;
  margin-top:calc(env(safe-area-inset-top,0px) + 12px);
  border-radius:20px;padding:16px 18px 10px;
  box-shadow:0 10px 30px -14px rgba(10,30,60,.35), inset 0 1px 0 rgba(255,255,255,.4);
}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px}
.brand h1{font-size:clamp(22px,4.2vw,34px);font-weight:800;line-height:1.05;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
.counts{display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.counts b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;width:fit-content;background:rgba(0,0,0,.05)}
:root[data-theme="dark"] .tabs{background:rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){ .tabs{background:rgba(0,0,0,.28)} }
.tab{position:relative;overflow:hidden;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);background:none;border:none;padding:9px 16px;cursor:pointer;border-radius:999px}
.tab.active{color:#05111C;background:linear-gradient(180deg,var(--accent),var(--accent-2));box-shadow:0 4px 14px -4px rgba(23,167,224,.5), inset 0 1px 0 rgba(255,255,255,.55)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section{padding-block:26px 8px}
.sectitle{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sectitle h2{font-size:clamp(18px,2.6vw,24px);font-weight:700}
.sectitle span{color:var(--muted);font-family:var(--mono);font-size:11.5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.grid.reserve{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.grid.square{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}

.card{min-width:0;display:flex;flex-direction:column;gap:8px;position:relative}
.cover-wrap{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);transition:transform .18s ease,box-shadow .18s ease}
.cover-wrap.portrait{aspect-ratio:3/4.2}
.cover-wrap.square{aspect-ratio:1/1}
.card:hover .cover-wrap{transform:translateY(-3px);box-shadow:0 16px 28px -14px rgba(10,30,60,.4), 0 0 0 1px var(--accent) inset}
.cover-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px;color:var(--muted)}
.cover-empty svg{opacity:.55}
.cover-empty span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;line-height:1.4}

.rank{position:absolute;top:8px;left:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(6,20,36,.55);color:#fff;font-family:var(--mono);font-weight:600;font-size:12px;padding:3px 8px;border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.rating{position:absolute;bottom:8px;right:8px;background:var(--gold);color:#241705;font-family:var(--mono);font-weight:700;font-size:11px;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.reserve-tag{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:3px 7px;border-radius:999px}
.card.is-reserve .cover-wrap{filter:grayscale(.45) opacity(.82)}
.card.is-reserve:hover .cover-wrap{filter:none}
.card h3{font-size:14px;font-weight:700;line-height:1.25;margin:0}
.card .sub{color:var(--muted);font-size:11.5px}

.empty-state{border:1.5px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state b{color:var(--ink);display:block;margin-bottom:6px;font-family:var(--display);font-size:19px;font-weight:700}

footer{padding:40px 0 30px;color:var(--muted);font-family:var(--mono);font-size:11px;text-align:center}
footer a{color:var(--accent)}

[hidden]{display:none!important}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type=search],.toolbar select{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--ink);font-family:var(--body);font-size:14px}
.toolbar input[type=search]{flex:1;min-width:180px}
.toolbar label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.card .note{margin:0;color:var(--muted);font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rating.unrated{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);font-weight:500}
@media (prefers-reduced-motion:reduce){ .cover-wrap,.tab{transition:none!important} }

.cover-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
</style>

  var TAB_ORDER = ['games','albums','soundtracks','finished'];
  var TAB_LABELS = {games:'Games',albums:'Albums',soundtracks:'Soundtracks',finished:'Finished'};
  var ICON_PHOTO = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9.5" r="1.4"></circle><path d="M21 15l-5-5-4 4-3-3-6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  var activeKey = 'games';

  var els = {
    tabs: document.getElementById('tabs'),
    rankedGrid: document.getElementById('rankedGrid'),
    reserveGrid: document.getElementById('reserveGrid'),
    countRanked: document.getElementById('countRanked'),
    countReserve: document.getElementById('countReserve'),
    rankedMeta: document.getElementById('rankedMeta'),
    lblRanked: document.getElementById('lblRanked'),
    lblReserve: document.getElementById('lblReserve'),
    brandTitle: document.getElementById('brandTitle'),
    brandSub: document.getElementById('brandSub'),
  };

  function esc(s){ var d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

  function renderTabs(){
    els.tabs.innerHTML = TAB_ORDER.map(function(k){
      return '<button type="button" class="tab'+(k===activeKey?' active':'')+'" data-key="'+k+'">'+esc(TAB_LABELS[k])+'</button>';
    }).join('');
    els.tabs.querySelectorAll('.tab').forEach(function(btn){
      btn.addEventListener('click', function(){ activeKey = btn.getAttribute('data-key'); renderTabs(); renderActive(); });
    });
  }

  function normTitle(s){ return String(s||'').toLowerCase().replace(/&/g,'and').replace(/\bii\b/g,'2').replace(/[^a-z0-9]+/g,''); }
  function titleKeys(s){
    var parts = String(s||'').split(/\s+\/\s+/).map(function(p){ return normTitle(p.replace(/\(.*?\)/g,'')); }).filter(Boolean);
    var whole = normTitle(s);
    if(parts.indexOf(whole) === -1) parts.push(whole);
    return parts;
  }
  function topMap(){ var m={}; DATA.games.items.forEach(function(g){ if(g.rank!=null) titleKeys(g.title).forEach(function(k){ m[k]=g.rank; }); }); return m; }
  function coverInner(g){
    return g.cover ? '<img src="'+esc(g.cover)+'" alt="" loading="lazy" decoding="async">'
      : '<div class="cover-empty">'+ICON_PHOTO+'<span>NO COVER ART YET</span></div>';
  }

  function finishedCardHTML(g, tops){
    var tr = tops[normTitle(g.title)];
    var topTag = tr!=null ? '<div class="rank">TOP 50 #'+esc(tr)+'</div>' : '';
    var has = g.rating!=null;
    var ratingTag = has ? '<div class="rating">'+esc(g.rating)+'/10</div>' : '<div class="rating unrated">Unrated</div>';
    return '<div class="card"><div class="cover-wrap portrait">'+coverInner(g)+topTag+ratingTag+'</div><h3>'+esc(g.title)+'</h3>'+
      (g.sub?'<div class="sub">'+esc(g.sub)+'</div>':'')+(g.notes?'<p class="note">'+esc(g.notes)+'</p>':'')+'</div>';
  }

  function renderFinished(conf){
    var tops = topMap(), items = conf.items;
    var q = document.getElementById('f-search').value.trim().toLowerCase();
    var sort = document.getElementById('f-sort').value;
    var un = document.getElementById('f-unrated').checked;
    var seen={}; items.forEach(function(g){ var r=tops[normTitle(g.title)]; if(r!=null) seen[r]=1; }); var inTop = Object.keys(seen).length;
    var rated = items.filter(function(g){ return g.rating!=null; }).length;
    els.countRanked.textContent = items.length; els.countReserve.textContent = inTop;
    els.rankedMeta.textContent = rated+' rated · '+(items.length-rated)+' still to rate';
    var list = items.filter(function(g){
      if(un && g.rating!=null) return false;
      return !q || g.title.toLowerCase().indexOf(q)!==-1 || (g.sub||'').toLowerCase().indexOf(q)!==-1 || (g.notes||'').toLowerCase().indexOf(q)!==-1;
    });
    list.sort(function(a,b){
      if(sort==='az') return a.title.localeCompare(b.title);
      var ra=a.rating==null?-1:a.rating, rb=b.rating==null?-1:b.rating;
      return (rb-ra)||a.title.localeCompare(b.title);
    });
    els.rankedGrid.className = 'grid';
    els.rankedGrid.innerHTML = list.length ? list.map(function(g){ return finishedCardHTML(g,tops); }).join('')
      : '<div class="empty-state" style="grid-column:1/-1"><b>No matches</b></div>';
  }

  function cardHTML(g, rankView, coverClass){
    if(activeKey==='games'){
      var fm={}; DATA.finished.items.forEach(function(f){ if(f.rating!=null) fm[normTitle(f.title)]=f.rating; });
      var rs=titleKeys(g.title).map(function(k){ return fm[k]; }).filter(function(r){ return r!=null; }).map(Number);
      if(rs.length){ var avg=Math.round(rs.reduce(function(x,y){return x+y;},0)/rs.length*10)/10; g=Object.assign({},g,{rating:avg}); }
    }
    var topTag = rankView ? '<div class="rank">#'+esc(g.rank)+'</div>' : '<div class="reserve-tag">RESERVE</div>';
    var ratingTag = (g.rating !== null && g.rating !== undefined) ? '<div class="rating">'+esc(g.rating)+'/10</div>' : '';
    return (
      '<div class="card'+(rankView?'':' is-reserve')+'">'+
        '<div class="cover-wrap '+coverClass+'">'+coverInner(g)+topTag+ratingTag+'</div>'+
        '<h3>'+esc(g.title)+'</h3>'+
        (g.sub ? '<div class="sub">'+esc(g.sub)+'</div>' : '')+
      '</div>'
    );
  }

  function renderActive(){
    var conf = DATA[activeKey];
    var coverClass = conf.cover === 'square' ? 'square' : 'portrait';
    els.brandTitle.textContent = conf.title;
    els.brandSub.textContent = conf.sub;
    var fin = conf.kind === 'finished';
    document.getElementById('reserveSection').hidden = fin;
    document.getElementById('toolbar').hidden = !fin;
    document.getElementById('rankedTitle').textContent = fin ? 'Finished games' : 'Top list';
    els.lblRanked.textContent = fin ? 'finished' : 'ranked';
    els.lblReserve.textContent = fin ? 'in your top 50' : 'reserve';
    if(fin){ renderFinished(conf); return; }

    var ranked = conf.items.filter(function(g){ return g.rank != null; }).sort(function(a,b){ return a.rank-b.rank; });
    var reserve = conf.items.filter(function(g){ return g.rank == null; });

    els.countRanked.textContent = ranked.length;
    els.countReserve.textContent = reserve.length;
    els.rankedMeta.textContent = ranked.length + ' of ' + conf.maxRank + ' slots filled';

    els.rankedGrid.className = 'grid' + (coverClass==='square' ? ' square' : '');
    els.rankedGrid.innerHTML = ranked.length
      ? ranked.map(function(g){ return cardHTML(g, true, coverClass); }).join('')
      : '<div class="empty-state" style="grid-column:1/-1"><b>Nothing ranked yet</b></div>';

    els.reserveGrid.className = 'grid reserve' + (coverClass==='square' ? ' square' : '');
    els.reserveGrid.innerHTML = reserve.length
      ? reserve.map(function(g){ return cardHTML(g, false, coverClass); }).join('')
      : '<div class="empty-state" style="grid-column:1/-1">Nothing in reserve yet.</div>';
  }

  ['f-search','f-sort','f-unrated'].forEach(function(id){
    document.getElementById(id).addEventListener(id==='f-search'?'input':'change', function(){ if(activeKey==='finished') renderActive(); });
  });
  renderTabs();
  renderActive();
})();
</script>
